# SUPPLEMENTARY reference (Chang'e-2, not LRO): cross-check of the LRO-referenced project of the same strip.
# TMC-2 nadir strip, 2026-08-23, ~73.5N 12.4E, sun el 13 deg. Reference: Chang'e-2 7 m ortho mosaic, north polar layer CE2_OrthoMosaic_7m_NP
# (Moon Trek tiles served to 16.7 m/px), polar stereographic (+proj=stere +lat_0=90 +lon_0=0 +R=1737400), built by scripts/fetch_trek_polar_nac.py --layer ce2_np.
# Alternative (LRO WAC 100 m, equirectangular, ok up to ~80N): ../data/raw/lro_reference/strip_n73e012/wac/strip_n73e012_WAC_100M.tif
# Check: warped strip vs CE2 matches visually; control grid ~0.2-0.5 km off (median patch NCC ~0.15, low-contrast terrain).
aoi:
  name: strip_n73e012_ce2
  lat_min: 72.66
  lat_max: 74.46
  lon_min: 10.61
  lon_max: 14.46
source:
  instrument: TMC2
  product_type: calibrated
  path: ../data/raw/chandrayaan2/tmc2/ch2_tmc_ncn_20260823T1657513854_d_img_d18
reference:
  provider: chang_e2_ortho_mosaic
  layer: CE2_OrthoMosaic_7m_NP
  path: ../data/raw/lro_reference/strip_n73e012/ce2/strip_n73e012_CE2_NP.tif
dem:
  enabled: false
pyramid:
  levels: 4
  downsample_factor: 4
matching:
  primary: classical
  fallback: classical
  confidence_threshold: 0.5
  crater:
    num_peaks: 40
    min_distance: 8
    smooth_sigma: 2
    ratio_test: 0.75
anms:
  grid_size: 8
  max_matches_per_tile: 25
geometry:
  transform: homography
  ransac: magsac
  reproj_threshold_px: 3.0
evaluation:
  output_dir: ../data/results/
