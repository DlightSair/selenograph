# TMC-2 forward strip, 2022-05-17, ~45N 10E. Reference: LRO WAC global mosaic (~100 m/px) built by scripts/fetch_wac_reference.py.
aoi:
  name: strip_n45e10
  lat_min: 43.9
  lat_max: 45.7
  lon_min: 9.55
  lon_max: 10.74

source:
  instrument: TMC2
  product_type: calibrated
  path: ../data/ch2_tmc_ncf_20220517T2100236594_d_img_d18

reference:
  provider: lroc_wac_mosaic
  layer: LRO_WAC_Mosaic_Global_303ppd_v02
  path: ../data/raw/lro_reference/strip_n45e10/wac/strip_n45e10_WAC_100M.tif

dem:
  enabled: false

pyramid:
  levels: 4
  downsample_factor: 4

matching:
  primary: loftr
  fallback: classical
  confidence_threshold: 0.5
  crater: {num_peaks: 40, min_distance: 8, smooth_sigma: 2, ratio_test: 0.75}

anms:
  grid_size: 8
  max_matches_per_tile: 25

geometry:
  transform: homography
  ransac: magsac
  reproj_threshold_px: 3.0

evaluation:
  output_dir: ../data/results/
