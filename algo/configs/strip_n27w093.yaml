# TMC-2 aft strip, 2026-08-31, ~27N 93W (lon 266-268E), sun el 34 deg. Reference: LRO WAC global mosaic (~100 m/px) built by scripts/fetch_wac_reference.py
# (built with NEGATIVE lons -93.68 -92.48: fetch_wac_reference.py subtracts 180 instead of 360 for lon > 180 and would fetch the wrong hemisphere).
# Check: warped strip vs WAC, patch NCC 0.93-0.97, control grid ~1 km off.
# DEM: global LOLA 118 m window (scripts/fetch_lola_global_window.py): terrain parallax for the off-nadir view and the DEM re-lit with the source's Sun.
aoi:
  name: strip_n27w093
  lat_min: 26.32
  lat_max: 28.12
  lon_min: 266.32
  lon_max: 267.52
source:
  instrument: TMC2
  product_type: calibrated
  path: ../data/raw/chandrayaan2/tmc2/ch2_tmc_nca_20260831T0617121701_d_img_d18
reference:
  provider: lroc_wac_mosaic
  layer: LRO_WAC_Mosaic_Global_303ppd_v02
  path: ../data/raw/lro_reference/strip_n27w093/wac/strip_n27w093_WAC_100M.tif
dem:
  enabled: true
  path: ../data/dem/lola_global/strip_n27w093_LDEM_118M.tif
pyramid:
  levels: 4
  downsample_factor: 4
matching:
  primary: classical
  fallback: classical
  confidence_threshold: 0.5
  crater:
    num_peaks: 40
    min_distance: 8
    smooth_sigma: 2
    ratio_test: 0.75
anms:
  grid_size: 8
  max_matches_per_tile: 25
geometry:
  transform: homography
  ransac: magsac
  reproj_threshold_px: 3.0
evaluation:
  output_dir: ../data/results/
registration:
  mode: prior_guided
  relit:
    enabled: true
    dem: ../data/dem/lola_global/strip_n27w093_LDEM_118M.tif
    weight: 1.0
