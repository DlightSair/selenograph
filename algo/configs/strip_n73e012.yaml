# Reference: LRO WAC global mosaic (100 m/px), the LRO reference for this strip; the Chang'e-2 7 m variant is strip_n73e012_ce2.yaml.
# DEM: global LOLA 118 m window (scripts/fetch_lola_global_window.py): terrain parallax for the off-nadir view and the DEM re-lit with the source's Sun.
aoi:
  name: strip_n73e012
  lat_min: 72.66
  lat_max: 74.46
  lon_min: 10.61
  lon_max: 14.46
source:
  instrument: TMC2
  product_type: calibrated
  path: ../data/raw/chandrayaan2/tmc2/ch2_tmc_ncn_20260823T1657513854_d_img_d18
reference:
  provider: lroc_wac_mosaic
  layer: LRO_WAC_Mosaic_Global_303ppd_v02
  path: ../data/raw/lro_reference/strip_n73e012/wac/strip_n73e012_WAC_100M.tif
dem:
  enabled: true
  path: ../data/dem/lola_global/strip_n73e012_LDEM_118M.tif
pyramid:
  levels: 4
  downsample_factor: 4
matching:
  primary: classical
  fallback: classical
  confidence_threshold: 0.5
  crater:
    num_peaks: 40
    min_distance: 8
    smooth_sigma: 2
    ratio_test: 0.75
anms:
  grid_size: 8
  max_matches_per_tile: 25
geometry:
  transform: homography
  ransac: magsac
  reproj_threshold_px: 3.0
evaluation:
  output_dir: ../data/results/
registration:
  mode: prior_guided
  relit:
    enabled: true
    dem: ../data/dem/lola_global/strip_n73e012_LDEM_118M.tif
    weight: 1.0
