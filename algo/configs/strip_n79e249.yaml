# Reference: LRO WAC global mosaic (100 m/px), the LRO reference for this strip; the Chang'e-2 7 m variant is strip_n79e249_ce2.yaml.
# RAW-level product: no control grid in the package, so the prior comes from the label's corner coordinates (corner_control_grid).
# DEM: global LOLA 118 m window (scripts/fetch_lola_global_window.py): terrain parallax for the off-nadir view and the DEM re-lit with the source's Sun.
aoi:
  name: strip_n79e249
  lat_min: 77.59
  lat_max: 79.73
  lon_min: 246.26
  lon_max: 251.25
source:
  instrument: TMC2
  product_type: calibrated
  path: ../data/raw/chandrayaan2/tmc2/ch2_tmc_nrn_20260902T0114079604_d_img_d18
reference:
  provider: lroc_wac_mosaic
  layer: LRO_WAC_Mosaic_Global_303ppd_v02
  path: ../data/raw/lro_reference/strip_n79e249/wac/strip_n79e249_WAC_100M.tif
dem:
  enabled: true
  path: ../data/dem/lola_global/strip_n79e249_LDEM_118M.tif
pyramid:
  levels: 4
  downsample_factor: 4
matching:
  primary: loftr
  fallback: classical
  confidence_threshold: 0.5
  crater:
    num_peaks: 40
    min_distance: 8
    smooth_sigma: 2
    ratio_test: 0.75
anms:
  grid_size: 8
  max_matches_per_tile: 25
geometry:
  transform: homography
  ransac: magsac
  reproj_threshold_px: 3.0
evaluation:
  output_dir: ../data/results/
registration:
  mode: prior_guided
  relit:
    enabled: true
    dem: ../data/dem/lola_global/strip_n79e249_LDEM_118M.tif
    weight: 1.0
