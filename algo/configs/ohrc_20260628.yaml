# OHRC south-polar pass; only the first 42,280 lines (10.6 km) are lit. Reference: LRO NAC south-pole mosaic (4.18 m/px); LOLA 20 m DEM.
# OHRC ch2_ohr_ncp_20260628T1010559550_d_img_d18: 0.29 m/px, sun az/el 36/1.1 deg, roll/pitch 1.02206/-21.672512 deg
aoi:
  name: ohrc_20260628
  lat_min: -85.737
  lat_max: -85.291
  lon_min: 0.0
  lon_max: 360.0
  source_rows:
  - 0
  - 42280
source:
  instrument: OHRC
  product_type: calibrated
  path: ../data/raw/chandrayaan2/ohrc/ch2_ohr_ncp_20260628T1010559550_d_img_d18
reference:
  provider: lroc_nac_avg_mosaic_sp
  layer: LRO_NAC_AvgMosaic_SPole855_1mp
  path: ../data/raw/lro_reference/ohrc_20260628/nac/ohrc_20260628_NAC_SP.tif
dem:
  enabled: true
  path: ../data/dem/lola_80s/ch2_ohr_ncp_20260628T1010559550_d_img_d18_LDEM_20M.tif
pyramid:
  levels: 4
  downsample_factor: 4
matching:
  primary: loftr
  fallback: classical
  confidence_threshold: 0.5
  crater:
    num_peaks: 40
    min_distance: 8
    smooth_sigma: 2
    ratio_test: 0.75
anms:
  grid_size: 8
  max_matches_per_tile: 25
geometry:
  transform: homography
  ransac: magsac
  reproj_threshold_px: 3.0
evaluation:
  output_dir: ../data/results/
registration:
  mode: prior_guided
  relit:
    enabled: true
    dem: ../data/dem/lola_80s/ch2_ohr_ncp_20260628T1010559550_d_img_d18_LDEM_20M.tif
    weight: 1.0
