# SUPPLEMENTARY reference (Chang'e-2, not LRO): cross-check of the LRO-referenced project of the same strip.
# TMC-2 nadir strip, 2026-09-05, ~77.6N 200E, sun el 8 deg. Reference: Chang'e-2 7 m ortho mosaic, north polar layer CE2_OrthoMosaic_7m_NP
# (Moon Trek tiles served to 16.7 m/px), polar stereographic, built by scripts/fetch_trek_polar_nac.py --layer ce2_np.
# Alternatives built too: LRO WAC 100 m equirect ../data/raw/lro_reference/strip_n77e200/wac/strip_n77e200_WAC_100M.tif (patch NCC 0.82 vs this strip,
# control grid ~2.3 km off), and LRO WAC polar 267 m/px (wacpolar/strip_n77e200_WACPOLAR_NP.tif, coarse).
aoi:
  name: strip_n77e200_ce2
  lat_min: 76.67
  lat_max: 78.47
  lon_min: 198.16
  lon_max: 202.97
source:
  instrument: TMC2
  product_type: calibrated
  path: ../data/raw/chandrayaan2/tmc2/ch2_tmc_ncn_20260905T2337004268_d_img_d18
reference:
  provider: chang_e2_ortho_mosaic
  layer: CE2_OrthoMosaic_7m_NP
  path: ../data/raw/lro_reference/strip_n77e200/ce2/strip_n77e200_CE2_NP.tif
dem:
  enabled: false
pyramid:
  levels: 4
  downsample_factor: 4
matching:
  primary: loftr
  fallback: classical
  confidence_threshold: 0.5
  crater:
    num_peaks: 40
    min_distance: 8
    smooth_sigma: 2
    ratio_test: 0.75
anms:
  grid_size: 8
  max_matches_per_tile: 25
geometry:
  transform: homography
  ransac: magsac
  reproj_threshold_px: 3.0
evaluation:
  output_dir: ../data/results/
