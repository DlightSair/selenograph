# TMC-2 nadir strip, 2022-05-17, ~47N 9E. Reference: LRO WAC global mosaic (~100 m/px) built by scripts/fetch_wac_reference.py.
aoi:
  name: strip_n47e09
  lat_min: 45.9
  lat_max: 47.7
  lon_min: 8.51
  lon_max: 9.62

source:
  instrument: TMC2
  product_type: calibrated
  path: ../data/ch2_tmc_ncn_20220517T2258012123_d_img_d18

reference:
  provider: lroc_wac_mosaic
  layer: LRO_WAC_Mosaic_Global_303ppd_v02
  path: ../data/raw/lro_reference/strip_n47e09/wac/strip_n47e09_WAC_100M.tif

dem:
  enabled: false

pyramid:
  levels: 4
  downsample_factor: 4

matching:
  primary: loftr
  fallback: classical
  confidence_threshold: 0.5
  crater: {num_peaks: 40, min_distance: 8, smooth_sigma: 2, ratio_test: 0.75}

anms:
  grid_size: 8
  max_matches_per_tile: 25

geometry:
  transform: homography
  ransac: magsac
  reproj_threshold_px: 3.0

evaluation:
  output_dir: ../data/results/
