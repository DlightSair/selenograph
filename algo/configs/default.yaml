# Project configuration template.
#
# One file per project in this folder. Paths are relative to algo/ (absolute paths also work).
# Create projects from the app (File > New project) or copy this file.

aoi:                         # area of interest, degrees; longitude in 0..360
  name: example_area
  lat_min: -43.85
  lat_max: -42.15
  lon_min: 348.00
  lon_max: 349.80
  # source_rows: [42020, 75220]   # optional: limit the source product to these image lines

source:
  instrument: TMC2           # TMC2 | OHRC | IIRS
  product_type: calibrated   # raw | calibrated | derived_dtm | derived_ortho
  path: ../data/raw/chandrayaan2/tmc2/<product folder>      # PDS4 product, with its geometry/ folder

reference:
  provider: lroc_nac_roi_mosaic
  layer: <layer name>
  path: ../data/raw/lro_reference/<area>/<mosaic>.tif       # georeferenced GeoTIFF

dem:                         # optional elevation model, enables the re-lit layer and the parallax term
  enabled: false
  path: ../data/dem/<area>/<dem>.tif

registration:
  mode: prior_guided
  # nonrigid: true           # smooth residual field (kept only if cross-validation improves)
  # parallax: true           # DEM parallax term (needs a DEM)
  # relit:                   # extra reference layer: the DEM shaded with the source's Sun angle
  #   enabled: true
  #   dem: ../data/dem/<area>/<dem>.tif
  #   weight: 1.0
  # structure: auto          # auto | intensity | edges | cfog | orient
  # min_ncc: 0.25            # minimum correlation for a tile to count

evaluation:
  output_dir: ../data/results/
